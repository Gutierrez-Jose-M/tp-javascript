<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Lista de Tareas</title>
    <link rel="stylesheet" href="../css/app.css">
</head>
<body>
<body style="text-align: center;">

    <h1 style="margin-top: 40px;">Mis Tareas</h1>

    <div style="background: white; padding: 20px; border-radius: 12px; box-shadow: var(--shadow); display: inline-block; margin-bottom: 30px;">
        <form id="todoForm">
            <input type="text" id="taskInput" class="search-input" placeholder="¿Qué hay que hacer?" style="width: 250px;">
            <button type="submit" style="padding: 10px 20px; border-radius: 8px; cursor: pointer; background: var(--primary-color); color: white; border: none;">Agregar</button>
        </form>
        <p style="margin-top: 15px; font-weight: bold;">Pendientes: <span id="contador">0</span></p>
    </div>

    <div id="todoList" class="grid-container"></div>

    <script src="todo.js"></script>
</body>
</html>
